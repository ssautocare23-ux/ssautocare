<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Log - SS Autocare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1e2326; color: #ffffff; }
        .glass-panel { background: rgba(42, 52, 57, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1rem; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: #9ca3af; transition: all 0.2s; }
        .sidebar-link:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .sidebar-link.active { background: rgba(255, 90, 0, 0.1); color: #ff5a00; border-right: 3px solid #ff5a00; }
        
        .input-dark { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 0.5rem; padding: 0.75rem 1rem; outline: none; transition: all 0.2s; width: 100%; font-size: 0.9rem;}
        .input-dark:focus { border-color: #ff5a00; box-shadow: 0 0 0 1px #ff5a00; }
        .label-dark { display: block; text-transform: uppercase; font-size: 0.75rem; font-weight: 600; color: #9ca3af; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
        
        .btn-primary { background-color: #ff5a00; color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; transition: all 0.2s; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary:hover { background-color: #e04f00; box-shadow: 0 0 15px rgba(255,90,0,0.4); }

        .table-dark th { background: rgba(0, 0, 0, 0.2); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; color: #9ca3af; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 1rem; text-align: left;}
        .table-dark td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 1rem; }
        .table-dark tr:last-child td { border-bottom: none; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e2326; }
        ::-webkit-scrollbar-thumb { background: #3F4A50; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 flex-shrink-0 border-r border-white/10 bg-[#1e2326] flex flex-col">
        <div class="p-6 border-b border-white/10">
            <h1 class="text-2xl font-bold tracking-wider uppercase text-white">
                <span class="text-[#ff5a00]">SS</span> Autocare
            </h1>
        </div>
        <nav class="flex-1 overflow-y-auto p-4 space-y-2">
            <a href="index.html" class="sidebar-link">
                <i data-lucide="layout-dashboard"></i> Dashboard
            </a>
            <a href="job-cards.html" class="sidebar-link">
                <i data-lucide="clipboard-list"></i> Job Cards
            </a>
            <a href="attendance-advances.html" class="sidebar-link">
                <i data-lucide="users"></i> HR & Labor
            </a>
            <a href="contractor-ledger.html" class="sidebar-link">
                <i data-lucide="hard-hat"></i> Contractors
            </a>
            <a href="purchase.html" class="sidebar-link active">
                <i data-lucide="shopping-cart"></i> Purchases
            </a>
            <a href="sales.html" class="sidebar-link">
                <i data-lucide="receipt"></i> Sales Invoices
            </a>
            <a href="quotations.html" class="sidebar-link">
                <i data-lucide="file-text"></i> Quotations
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-gradient-to-br from-[#1e2326] to-[#0f1113] p-8">
        
        <div class="max-w-5xl mx-auto w-full space-y-8">
            
            <header class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-3xl font-bold text-white mb-2">Purchase Entry</h2>
                    <p class="text-gray-400">Log incoming materials and spares bills.</p>
                </div>
            </header>

            <form id="purchaseForm" class="space-y-8" onsubmit="savePurchase(event)">
                <div class="glass-panel p-8">
                    <h3 class="text-lg font-semibold text-[#007bff] mb-6 border-b border-white/10 pb-2 flex items-center gap-2">
                        <i data-lucide="file-input"></i> Bill / Invoice Details
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div>
                            <label class="label-dark">Date *</label>
                            <input type="date" id="pDate" class="input-dark" required>
                        </div>
                        <div>
                            <label class="label-dark">Supplier / Vendor *</label>
                            <input type="text" id="pSupplier" class="input-dark" placeholder="e.g. Ramesh Hardwares" required>
                        </div>
                        <div>
                            <label class="label-dark">Bill / Invoice No.</label>
                            <input type="text" id="pInvoice" class="input-dark" placeholder="Optional">
                        </div>
                        <div>
                            <label class="label-dark">Total Amount (₹) *</label>
                            <input type="number" id="pAmount" class="input-dark font-mono text-[#ff5a00]" required>
                        </div>
                    </div>
                    <div class="mt-6">
                        <label class="label-dark">Material Description / Notes</label>
                        <input type="text" id="pDesc" class="input-dark" placeholder="e.g. MS Angles, Welding Rods, Paint box">
                    </div>
                </div>

                <div class="flex justify-end gap-4">
                    <button type="submit" class="btn-primary"><i data-lucide="plus-circle"></i> Add Purchase Entry</button>
                </div>
            </form>

            <div class="glass-panel flex flex-col mt-12 mb-20">
                <div class="p-6 border-b border-white/5 flex justify-between items-center">
                    <h3 class="text-lg font-semibold">Recent Purchases Log</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full table-dark">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Supplier</th>
                                <th>Bill No.</th>
                                <th>Description</th>
                                <th class="text-right">Amount (₹)</th>
                            </tr>
                        </thead>
                        <tbody id="purchaseList">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();
        document.getElementById('pDate').value = new Date().toISOString().split('T')[0];

        if(!localStorage.getItem('erp_purchases')) {
            localStorage.setItem('erp_purchases', '[]');
        }

        function loadPurchases() {
            const purchases = JSON.parse(localStorage.getItem('erp_purchases') || '[]');
            const tbody = document.getElementById('purchaseList');
            tbody.innerHTML = '';

            if(purchases.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-gray-500 italic">No purchases recorded yet.</td></tr>';
                return;
            }

            purchases.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="text-gray-400 whitespace-nowrap">${p.date}</td>
                        <td class="font-medium text-white">${p.supplier}</td>
                        <td class="text-gray-500">${p.invoice || '-'}</td>
                        <td class="text-gray-300 truncate max-w-xs">${p.desc || '-'}</td>
                        <td class="text-right font-mono font-bold text-[#ff5a00]">₹${parseFloat(p.amount).toLocaleString('en-IN')}</td>
                    </tr>
                `;
            });
        }

        function savePurchase(e) {
            e.preventDefault();
            const date = document.getElementById('pDate').value;
            const supplier = document.getElementById('pSupplier').value;
            const invoice = document.getElementById('pInvoice').value;
            const amount = document.getElementById('pAmount').value;
            const desc = document.getElementById('pDesc').value;

            const purchases = JSON.parse(localStorage.getItem('erp_purchases') || '[]');
            purchases.unshift({
                id: Date.now(),
                date, supplier, invoice, amount, desc
            });
            localStorage.setItem('erp_purchases', JSON.stringify(purchases));
            
            document.getElementById('pSupplier').value = '';
            document.getElementById('pInvoice').value = '';
            document.getElementById('pAmount').value = '';
            document.getElementById('pDesc').value = '';
            
            loadPurchases();
        }

        loadPurchases();
    </script>
</body>
</html>
