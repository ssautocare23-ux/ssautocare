<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SS Auto Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1e2326; color: #ffffff; }
        .glass-panel { background: rgba(42, 52, 57, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1rem; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: #9ca3af; transition: all 0.2s; }
        .sidebar-link:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .sidebar-link.active { background: rgba(255, 90, 0, 0.1); color: #ff5a00; border-right: 3px solid #ff5a00; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="w-64 flex-shrink-0 border-r border-white/10 bg-[#1e2326] flex flex-col">
        <div class="p-6 border-b border-white/10">
            <h1 class="text-2xl font-bold tracking-wider uppercase text-white">
                <span class="text-[#ff5a00]">SS</span> Auto Care
            </h1>
        </div>
        <nav class="flex-1 overflow-y-auto p-4 space-y-2">
            <a href="dashboard.html" class="sidebar-link active">
                <i data-lucide="layout-dashboard"></i> Dashboard
            </a>
            <a href="attendance-advances.html" class="sidebar-link">
                <i data-lucide="users"></i> HR & Labor
            </a>
            <a href="index.html" class="sidebar-link">
                <i data-lucide="globe"></i> Public Site
            </a>
            <a href="login.html" class="sidebar-link">
                <i data-lucide="log-out"></i> Logout
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-gradient-to-br from-[#1e2326] to-[#0f1113]">
        <header class="h-20 flex-shrink-0 px-8 flex items-center justify-between border-b border-white/5 backdrop-blur-sm sticky top-0 z-10">
            <div>
                <h2 class="text-xl font-semibold">Workshop Overview</h2>
                <p class="text-sm text-gray-400">Salem Branch Management</p>
            </div>
        </header>

        <div class="p-8 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="glass-panel p-6">
                    <p class="text-sm text-gray-400">Active Job Cards</p>
                    <h3 class="text-2xl font-bold mt-1 text-white">12</h3>
                </div>
                <div class="glass-panel p-6">
                    <p class="text-sm text-gray-400">Total Workers</p>
                    <h3 class="text-2xl font-bold mt-1 text-white">8</h3>
                </div>
                <div class="glass-panel p-6">
                    <p class="text-sm text-gray-400">Pending Advances</p>
                    <h3 class="text-2xl font-bold mt-1 text-white">₹14,500</h3>
                </div>
                <div class="glass-panel p-6">
                    <p class="text-sm text-gray-400">Monthly Revenue</p>
                    <h3 class="text-2xl font-bold mt-1 text-white">₹2,45,000</h3>
                </div>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
