<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS Auto Care - Salem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1e2326; color: #ffffff; }
        .glass-panel { background: rgba(42, 52, 57, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="border-b border-white/10 p-6 flex justify-between items-center max-w-7xl mx-auto w-full">
        <h1 class="text-2xl font-bold uppercase tracking-wider"><span class="text-[#ff5a00]">SS</span> Auto Care</h1>
        <div class="flex gap-4">
            <a href="login.html" class="px-4 py-2 bg-[#ff5a00] rounded-lg font-medium hover:bg-[#e04f00] transition">Admin Login</a>
        </div>
    </header>
    <main class="flex-1 flex flex-col items-center justify-center text-center p-6 max-w-4xl mx-auto space-y-6">
        <div class="glass-panel p-8 w-full">
            <h2 class="text-4xl font-bold mb-4">Commercial Vehicle Body Building & Fabrication</h2>
            <p class="text-gray-400 mb-6">Specializing in custom hydraulic tippers, open bodies, water tanks, tinkering, and painting in Salem, Tamil Nadu.</p>
            <a href="dashboard.html" class="inline-block px-6 py-3 bg-white text-gray-900 rounded-lg font-semibold hover:bg-gray-200 transition">View Workshop Dashboard</a>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
